<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#4F46E5" />
      <stop offset="50%" stopColor="#4338CA" />
      <stop offset="100%" stopColor="#1E1B4B" />
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stopColor="#06B6D4" />
      <stop offset="50%" stopColor="#6366F1" />
      <stop offset="100%" stopColor="#A855F7" />
    </linearGradient>
    <linearGradient id="loopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="40%" stopColor="#C7D2FE" />
      <stop offset="75%" stopColor="#818CF8" />
      <stop offset="100%" stopColor="#4F46E5" />
    </linearGradient>
    <linearGradient id="surgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="50%" stopColor="#34D399" />
      <stop offset="100%" stopColor="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="98" height="98" rx="23" stroke="#818CF8" stroke-width="2" stroke-opacity="0.3" fill="none" />

  <!-- Left Vertical Pillar -->
  <rect x="20" y="22" width="14" height="56" rx="7" fill="url(#stemGrad)" />

  <!-- Upper Loop -->
  <path d="M27 22 H54 C66 22 76 31 76 43 C76 55 66 63 54 63 H34" stroke="url(#loopGrad)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Dynamic Recovery Surge -->
  <path d="M44 52 L69 77 C72 80 77 78 77 73 L77 62" stroke="url(#surgeGrad)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Central AI Pulse -->
  <circle cx="49" cy="42.5" r="4.5" fill="#FFFFFF" filter="url(#glow)" />
  <circle cx="49" cy="42.5" r="2" fill="#6366F1" />
</svg>
